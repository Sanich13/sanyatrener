#splash .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,0) 30%,rgba(0,0,0,.88) 72%,#000)}
#splash .grain{position:absolute;inset:-50%;opacity:.14;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-5%)}75%{transform:translate(-5%,-2%)}100%{transform:translate(0)}}
.title{position:relative;z-index:2;font-family:var(--display);font-weight:400;font-size:min(17vw,76px);line-height:.86;text-align:center;margin:0 0 14px}
.title b{color:var(--red);font-weight:400}.sub{position:relative;z-index:2;color:var(--mute);margin:0 0 30px}
#play{position:relative;z-index:2;width:96px;height:96px;border-radius:50%;background:var(--red);display:grid;place-items:center;animation:pulse 2.2s ease-out infinite}
#play svg{width:40px;height:40px;margin-left:6px;fill:var(--paper)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,52,47,.55)}80%,100%{box-shadow:0 0 0 30px rgba(229,52,47,0)}}
#splash.go .title{animation:glitch .7s steps(1) forwards}#splash.go .art{animation:slice .7s steps(1) forwards}#splash.go #play{animation:none;transform:scale(.85)}
@keyframes glitch{0%{transform:none}10%{transform:translate(-8px,2px);text-shadow:6px 0 var(--red),-6px 0 var(--cold)}25%{transform:translate(10px,-3px);text-shadow:-8px 0 var(--red),8px 0 var(--cold);clip-path:inset(0 0 55% 0)}40%{transform:translate(-12px,4px);clip-path:inset(40% 0 0 0)}55%{transform:translate(6px,0);clip-path:none;text-shadow:10px 0 var(--red),-10px 0 var(--cold)}75%{transform:translate(-4px,-2px);opacity:.6}100%{opacity:0}}
@keyframes slice{20%{transform:translateX(-14px) scale(1.04);filter:contrast(1.8) hue-rotate(-30deg)}40%{transform:translateX(18px) scale(1.04);clip-path:inset(30% 0 30% 0)}60%{clip-path:none;transform:translateX(-8px) scale(1.06);filter:contrast(1.4) invert(1)}100%{transform:scale(1.1);filter:contrast(1.2)}}
#splash.out{opacity:0;transition:opacity .45s .55s;pointer-events:none}
#app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;opacity:0;transition:opacity .5s}#app.on{opacity:1}
header{padding:16px 20px 4px;display:flex;align-items:baseline;justify-content:space-between}
h1.t{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;margin:0}h1.t i{color:var(--red);font-style:normal}
.date{color:var(--mute);font-size:14px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 16px 24px;-webkit-overflow-scrolling:touch}
#view{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:rgba(19,19,21,.9);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px)}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px;letter-spacing:.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.mute{color:var(--mute);font-size:14px}
.big{font-family:var(--display);font-size:46px;line-height:1}.big small{font-size:20px;color:var(--mute);margin-left:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;text-align:center;font-size:12px;color:var(--mute)}
.cal span{aspect-ratio:1;border-radius:5px;background:#1d1d20;display:grid;place-items:center}.cal span.e{background:none}.cal span.t{background:var(--red);color:var(--paper);font-weight:600}.cal span.n{outline:1.5px solid var(--paper);outline-offset:1px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red) var(--p),#232327 0);flex:none}
.ring div{width:78px;height:78px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:25px;line-height:1}.ring small{display:block;font-family:var(--body);font-size:11px;color:var(--mute)}
.mac{display:flex;gap:14px}.mac b{display:block;font-family:var(--display);font-size:24px;font-weight:400}
.pr{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.pr:first-child{border-top:0}.pr .n{flex:1;min-width:0}.pr .n b{display:block;font-weight:600}
.badge{background:var(--red);font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.e1v{text-align:right}.e1v .v{font-family:var(--display);font-size:34px;line-height:1}.e1v small{font-size:15px;color:var(--mute)}.up{color:var(--red);font-size:13px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-size:15px}.chip.on{background:var(--red);border-color:var(--red);color:var(--paper)}
.btn{display:block;width:100%;background:var(--red);color:var(--paper);border-radius:12px;padding:14px;font-size:17px;font-weight:600;text-align:center}.btn.gh{background:#1d1d20;border:1px solid var(--line)}.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
input,select{width:100%;background:#0e0e10;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px}input:focus,select:focus{outline:1.5px solid var(--red)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f2 input{margin:0}.gap{height:8px}
.xl{display:block;width:100%;text-align:left;padding:13px 4px;border-top:1px solid var(--line);font-size:16px}.xl:first-child{border-top:0}.xl.on{color:var(--red);font-weight:600}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:16px}.set:first-of-type{border-top:0}.x{color:var(--mute);padding:6px 10px;font-size:20px}
.leg{height:8px;border-radius:4px;background:linear-gradient(90deg,#2a2a2f,#4084f5 8%,#a054be 50%,#ec302c);margin:6px 0 4px}
.bodies{display:flex;justify-content:center;gap:4px}.bodies svg{width:48%;max-width:200px;height:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.warn{background:#2a1513;border-color:#5a2420}details summary{cursor:pointer;color:var(--mute);padding:6px 0}
nav{flex:none;position:relative;z-index:2;display:flex;background:rgba(9,9,10,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;padding:11px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:11.5px;position:relative}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--red)}nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:99px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function records(S,end=today()){
  const m={};
  for(const wo of byOrder(S))for(const s of wo.sets){
    const v=e1(s.w,s.r),x=m[s.ex]||(m[s.ex]={ex:s.ex,e1:0,w:0,r:0,date:null,prev:0,hist:[]});
    if(v>x.e1+1e-9){x.prev=x.e1;x.e1=v;x.w=s.w;x.r=s.r;x.date=wo.date}

    if(h&&h.date===wo.date)h.e1=x.e1;else x.hist.push({date:wo.date,e1:x.e1});
